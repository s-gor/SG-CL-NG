name: Apply AWG 3.1 implementation

on:
  push:
    branches:
      - feature/awg31
    paths:
      - .github/workflows/apply-awg31.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/awg31
          fetch-depth: 0

      - name: Apply implementation patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = ""
          Path('/tmp/awg31.patch').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply --check /tmp/awg31.patch
          git apply /tmp/awg31.patch

      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/apply-awg31.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2rayN/ServiceLib/Manager/AmneziaWgManager.cs .github/workflows/apply-awg31.yml
          git commit -m "feat: add AWG 3.1 dual runtime support"
          git push origin HEAD:feature/awg31
