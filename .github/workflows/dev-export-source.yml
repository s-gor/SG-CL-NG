name: Development Source Export

on:
  push:
    branches:
      - feature/awg31

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload source snapshot
        uses: actions/upload-artifact@v5
        with:
          name: sg-cl-ng-feature-awg31-source
          path: .
          include-hidden-files: true
          if-no-files-found: error
