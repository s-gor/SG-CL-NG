name: Build AWG 3.1 test package

on:
  push:
    branches:
      - feature/awg31
    paths:
      - .github/workflows/build-awg31-test.yml

permissions:
  contents: read

jobs:
  build-package:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore v2rayN/v2rayN.sln

      - name: Unit tests
        run: dotnet test v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=service-lib-tests.trx"

      - name: Publish SG Client
        run: dotnet publish v2rayN/v2rayN/v2rayN.csproj -c Release -r win-x64 -p:SelfContained=true -p:EnableWindowsTargeting=true -o package

      - name: Prepare official AmneziaWG 3.1 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/amnezia-vpn/amneziawg-windows-client/releases/download/3.1.0/amneziawg-amd64-3.1.0.msi'
          $expected = 'a1b48ea8699cd347832a3691d832004574ef8ad65bcf887611ac8acb99b7de8b'
          $msi = Join-Path $env:RUNNER_TEMP 'amneziawg-amd64-3.1.0.msi'
          $extract = Join-Path $env:RUNNER_TEMP 'awg31-extract'
          $msiLog = Join-Path $env:RUNNER_TEMP 'awg31-msiexec.log'
          $target = Join-Path $env:GITHUB_WORKSPACE 'package\bin\awg31'

          Invoke-WebRequest -Uri $url -OutFile $msi
          $actual = (Get-FileHash -Algorithm SHA256 $msi).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "AmneziaWG 3.1 MSI SHA-256 mismatch: $actual"
          }

          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $arguments = @(
            '/a', $msi,
            '/qn',
            '/norestart',
            'DO_NOT_LAUNCH=1',
            "TARGETDIR=$extract",
            '/L*v', $msiLog
          )
          $process = Start-Process -FilePath msiexec.exe -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            Get-Content $msiLog -ErrorAction SilentlyContinue
            throw "MSI extraction failed with code $($process.ExitCode)"
          }

          $gui = Get-ChildItem $extract -Recurse -File -Filter amneziawg.exe | Sort-Object Length -Descending | Select-Object -First 1
          $cli = Get-ChildItem $extract -Recurse -File -Filter awg.exe | Sort-Object Length -Descending | Select-Object -First 1
          $wintun = Get-ChildItem $extract -Recurse -File -Filter wintun.dll | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $gui -or -not $cli -or -not $wintun) {
            throw 'Required AmneziaWG 3.1 runtime files were not found in the MSI.'
          }

          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item $gui.FullName (Join-Path $target 'amneziawg.exe')
          Copy-Item $cli.FullName (Join-Path $target 'awg.exe')
          Copy-Item $wintun.FullName (Join-Path $target 'wintun.dll')

          $manifest = Join-Path $target 'AWG31-SHA256.txt'
          @(
            'Official AmneziaWG Windows runtime 3.1.0 x64',
            "Source: $url",
            "MSI SHA256: $expected"
          ) | Set-Content -Encoding utf8 $manifest
          foreach ($name in @('amneziawg.exe', 'awg.exe', 'wintun.dll')) {
            $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $target $name)).Hash.ToLowerInvariant()
            Add-Content -Encoding utf8 $manifest "$hash  $name"
          }

      - name: Verify package
        shell: pwsh
        run: |
          $required = @(
            'package\SG-Client.exe',
            'package\bin\awg31\amneziawg.exe',
            'package\bin\awg31\awg.exe',
            'package\bin\awg31\wintun.dll',
            'package\bin\awg31\AWG31-SHA256.txt'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing package file: $path" }
          }

      - name: Upload test package
        uses: actions/upload-artifact@v5
        with:
          name: sg-cl-ng-awg31-test-package
          path: package
          if-no-files-found: error
